<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人网站</title>
    <link rel="stylesheet" href="style.css">
    <!-- 从Google Fonts加载思源字体（思源宋体、思源黑体） -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
</head>
<body>
    <!-- 背景闪烁星星 -->
    <div class="stars-container">
        <div class="star star-1"></div>
        <div class="star star-2"></div>
        <div class="star star-3"></div>
        <div class="star star-4"></div>
        <div class="star star-5"></div>
        <div class="star star-6"></div>
        <div class="star star-7"></div>
        <div class="star star-8"></div>
        <div class="star star-9"></div>
        <div class="star star-10"></div>
        <div class="star star-11"></div>
        <div class="star star-12"></div>
        <div class="star star-13"></div>
        <div class="star star-14"></div>
        <div class="star star-15"></div>
        <div class="star star-16"></div>
        <div class="star star-17"></div>
        <div class="star star-18"></div>
        <div class="star star-19"></div>
        <div class="star star-20"></div>
        <div class="star star-21"></div>
        <div class="star star-22"></div>
        <div class="star star-23"></div>
        <div class="star star-24"></div>
    </div>

    <!-- 顶部导航栏 -->
    <nav class="top-navbar">
        <div class="nav-container">
            <!-- 左侧：个人logo和姓名 -->
            <div class="personal-logo">
                <div class="logo-circle">
                    <span class="logo-letter">Z</span>
                </div>
                <span class="logo-name">ZHENG BIN KUN</span>
            </div>

            <!-- 网页端导航菜单 -->
            <div class="nav-menu">
                <a href="#projects">近期案例</a>
                <a href="#contact">合作联系</a>
                <a href="about.html">关于我</a>
            </div>

            <!-- 右侧：定位信息 -->
            <div class="location-marker">
                <i class="fas fa-map-marker-alt"></i>
                <span>中国·厦门</span>
            </div>

            <!-- 移动端菜单按钮 -->
            <button class="mobile-menu-btn" id="mobileMenuBtn">
                <i class="fas fa-bars"></i>
            </button>

            <!-- 移动端下拉菜单 -->
            <div class="mobile-dropdown" id="mobileDropdown">
                <a href="#contact">合作联系</a>
                <a href="#projects">近期案例</a>
                <a href="about.html">关于我</a>
                <div class="mobile-location">
                    <i class="fas fa-map-marker-alt"></i>
                    <span>中国·厦门</span>
                </div>
            </div>
        </div>
    </nav>


    <!-- 主要内容区域 -->
    <main>
        <section id="about" class="section">
            <div class="about-container">
                <!-- 左侧：图片 -->
                <div class="about-image">
                    <div class="banner-placeholder">
                        <i class="fas fa-image"></i>
                        <p> </p>
                    </div>
                </div>

                <!-- 右侧：文字和按钮 -->
                <div class="about-content">
                    <div class="horizontal-layout">
                        <p class="left-text">统筹·设计·执行</p>
                        <div class="vertical-line"></div>
                        <p class="right-text">15 YOS·一站式空间营造者</p>
                    </div>
                    <button class="cooperation-btn">
                        联系我 <i class="fas fa-arrow-right"></i>
                    </button>
                </div>
            </div>
        </section>

        <!-- 近期案例 - 双行轮播 -->
        <section id="projects" class="section">
            <div class="content">
                <h2 class="section-title">近期案例</h2>
                <div class="projects-swiper swiper">
                    <div class="swiper-wrapper">
                        <div class="swiper-slide">
                            <a href="project-airport.html" class="project-card-link">
                                <div class="project-card-img">
                                    <img src="image/zt/zt-01.webp" alt="四川场道翔安机场项目部展厅">
                                </div>
                                <div class="project-card-label">四川场道翔安机场项目部展厅</div>
                            </a>
                        </div>
                        <div class="swiper-slide">
                            <a href="project-liming.html" class="project-card-link">
                                <div class="project-card-img">
                                    <img src="image/kczdzx/kczdzx-02.webp" alt="黎明科技创新指导中心">
                                </div>
                                <div class="project-card-label">黎明科技创新指导中心</div>
                            </a>
                        </div>
                        <div class="swiper-slide">
                            <a href="project-xunzhan.html" class="project-card-link">
                                <div class="project-card-img">
                                    <img src="image/zl/xgt/xgt-01.webp" alt="闽货华夏行巡展">
                                </div>
                                <div class="project-card-label">闽货华夏行系列巡展</div>
                            </a>
                        </div>
                        <div class="swiper-slide">
                            <a href="project-haicang.html" class="project-card-link">
                                <div class="project-card-img">
                                    <img src="image/yz/xgt/yz-01.webp" alt="厦门海沧新时代文明实践站">
                                </div>
                                <div class="project-card-label">海沧新时代文明实践站</div>
                            </a>
                        </div>
                    </div>
                </div>
                <a href="https://www.zcool.com.cn/u/16878121" target="_blank" class="more-link">查看更多 <i class="fas fa-arrow-right"></i></a>
            </div>
        </section>

        <!-- 合作联系模块 -->
        <section id="contact" class="section">
            <div class="content">
                <h2 class="section-title">合作联系</h2>
                <div class="contact-card">
                    <div class="contact-qr">
                        <img src="image/qr-wechat.webp" alt="微信扫码">
                        <span>扫码咨询</span>
                    </div>
                    <div class="contact-detail">
                        <div class="contact-row"><i class="fas fa-envelope"></i><span>876253104@qq.com</span></div>
                        <div class="contact-row"><i class="fab fa-qq"></i><span>876253104</span></div>
                        <div class="contact-row"><i class="fab fa-weixin"></i><span>zbk876253104</span></div>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <!-- 向上箭头按钮 -->
    <div class="fixed-btns">
        <a href="index.html" class="btn-home" title="回到主页"><i class="fas fa-home"></i></a>
        <div class="back-to-top" id="backToTop"><i class="fas fa-chevron-up"></i></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
