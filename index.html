<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>设计师作品集</title>
    <link rel="stylesheet" href="style.css">
    <!-- 从Google Fonts加载思源字体（思源宋体、思源黑体） -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- 顶部导航栏 -->
    <nav class="top-navbar">
        <div class="nav-container">
            <!-- 左侧：个人logo和姓名 -->
            <div class="personal-logo">
                <div class="logo-circle">
                    <span class="logo-letter">Z</span>
                </div>
                <span class="logo-name">ZHENG BIN KUN</span>
            </div>

            <!-- 网页端导航菜单 -->
            <div class="nav-menu">
                <a href="#projects">项目案例</a>
                <a href="#about">关于我</a>
                <a href="#contact">合作联系</a>
            </div>

            <!-- 右侧：定位信息 -->
            <div class="location-marker">
                <i class="fas fa-map-marker-alt"></i>
                <span>中国·厦门</span>
            </div>

            <!-- 移动端菜单按钮 -->
            <button class="mobile-menu-btn" id="mobileMenuBtn">
                <i class="fas fa-bars"></i>
            </button>

            <!-- 移动端下拉菜单 -->
            <div class="mobile-dropdown" id="mobileDropdown">
                <div class="mobile-location">
                    <i class="fas fa-map-marker-alt"></i>
                    <span>中国·厦门</span>
                </div>
                <a href="#projects">项目案例</a>
                <a href="#about">关于我</a>
                <a href="#contact">合作联系</a>
            </div>
        </div>
    </nav>


    <!-- 主要内容区域 -->
    <main>
        <section id="about" class="section">
            <div class="about-container">
                <!-- 左侧：图片 -->
                <div class="about-image">
                    <div class="banner-placeholder">
                        <i class="fas fa-image"></i>
                        <p>横幅图片位置</p>
                    </div>
                </div>

                <!-- 右侧：文字和按钮 -->
                <div class="about-content">
                    <div class="horizontal-layout">
                        <p class="left-text">策划·设计·执行</p>
                        <div class="vertical-line"></div>
                        <p class="right-text">15 YOS·一站式空间营造者</p>
                    </div>
                    <button class="cooperation-btn">
                        商务合作 <i class="fas fa-arrow-right"></i>
                    </button>
                </div>
            </div>
        </section>

        <!-- 项目案例模块 -->
        <section id="projects" class="section">
            <div class="content">
                <h2 class="section-title">项目案例</h2>
                <div class="projects-grid">
                    <div class="project-item">
                        <div class="project-image">
                            <i class="fas fa-paint-brush"></i>
                        </div>
                        <h3 class="project-name">商业空间设计</h3>
                    </div>
                    <div class="project-item">
                        <div class="project-image">
                            <i class="fas fa-paint-brush"></i>
                        </div>
                        <h3 class="project-name">住宅设计</h3>
                    </div>
                    <div class="project-item">
                        <div class="project-image">
                            <i class="fas fa-paint-brush"></i>
                        </div>
                        <h3 class="project-name">办公室设计</h3>
                    </div>
                    <div class="project-item">
                        <div class="project-image">
                            <i class="fas fa-paint-brush"></i>
                        </div>
                        <h3 class="project-name">零售店设计</h3>
                    </div>
                    <div class="project-item">
                        <div class="project-image">
                            <i class="fas fa-paint-brush"></i>
                        </div>
                        <h3 class="project-name">餐厅设计</h3>
                    </div>
                    <div class="project-item">
                        <div class="project-image">
                            <i class="fas fa-paint-brush"></i>
                        </div>
                        <h3 class="project-name">酒店设计</h3>
                    </div>
                </div>
            </div>
        </section>

        <!-- 合作联系模块 -->
        <section id="contact" class="section">
            <div class="content">
                <h2 class="section-title">合作联系</h2>
                <div class="contact-info">
                    <p>如果您有设计项目需要合作，欢迎通过以下方式联系：</p>
                    <ul class="contact-list">
                        <li><i class="fas fa-envelope"></i> 邮箱：contact@example.com</li>
                        <li><i class="fas fa-phone"></i> 电话：+86 138-XXXX-XXXX</li>
                        <li><i class="fab fa-weixin"></i> 微信：designer_zheng</li>
                        <li><i class="fas fa-map-marker-alt"></i> 地址：中国·厦门市</li>
                    </ul>
                </div>
            </div>
        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
