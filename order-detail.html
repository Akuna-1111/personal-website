    <style>
        .order-card {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 16px;
            padding: 36px 32px;
            margin-bottom: 24px;
        }
        .order-no {
            font-size: 0.75rem;
            color: #6e7a94;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 20px;
        }
        .order-no span {
            color: #00cc00;
            font-weight: 600;
        }
        .order-plan-title {
            font-size: 1.4rem;
            font-weight: 700;
            color: #e8ecf1;
            margin-bottom: 4px;
        }
        .order-plan-en {
            font-size: 0.78rem;
            color: #6e7a94;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin-bottom: 24px;
        }
        .order-detail-row {
            display: flex;
            gap: 16px;
            margin-bottom: 14px;
        }
        .order-detail-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #00cc00;
            padding: 2px 10px;
            border: 1px solid rgba(0,204,0,0.2);
            border-radius: 50px;
            white-space: nowrap;
            height: fit-content;
        }
        .order-detail-text {
            font-size: 0.85rem;
            color: #6e7a94;
            line-height: 1.7;
        }
        .order-summary-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 24px;
            background: rgba(0,204,0,0.04);
            border: 1px solid rgba(0,204,0,0.1);
            border-radius: 12px;
            overflow: hidden;
        }
        .order-summary-table td {
            padding: 14px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            font-size: 0.85rem;
            color: #6e7a94;
        }
        .order-summary-table tr:last-child td {
            border-bottom: none;
        }
        .order-summary-table td:first-child {
            width: 30%;
            color: #6e7a94;
            font-size: 0.78rem;
        }
        .order-summary-table td:last-child {
            color: #e8ecf1;
            font-weight: 600;
        }
        .order-summary-table td.green {
            color: #00cc00;
        }
        .order-actions {
            display: flex;
            gap: 14px;
            margin-top: 28px;
        }
        .order-btn {
            flex: 1;
            padding: 14px 0;
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            border-radius: 10px;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            font-family: inherit;
            border: none;
            transition: all 0.25s ease;
        }
        .order-btn-primary {
            background: #00cc00;
            color: #000;
        }
        .order-btn-primary:hover {
            background: #00dd00;
            transform: scale(1.02);
        }
        .order-btn-outline {
            background: transparent;
            color: #00cc00;
            border: 1px solid rgba(0,204,0,0.3);
        }
        .order-btn-outline:hover {
            background: rgba(0,204,0,0.08);
        }
        .order-empty {
            text-align: center;
            padding: 80px 0;
            color: #6e7a94;
        }
        @media (max-width: 768px) {
            .order-card { padding: 24px 18px; }
            .order-summary-table td { padding: 12px 14px; font-size: 0.8rem; }
            .order-actions { flex-direction: column; }
        }
    </style>
